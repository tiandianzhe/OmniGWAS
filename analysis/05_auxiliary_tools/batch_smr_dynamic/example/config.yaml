# Example configuration for the experimental dynamic SMR adapter.
# Replace every path and verify each optional xQTL resource before running.

out_filename: "path/to/outcome.rds"
outcome_name: "example_trait"
xqtl_resources:
  - "TN_0h"
  - "TN_16h"
xqtl_type: "sc_eqtl"
pval: 5e-8
diff_freq_prop: 0.9
diff_freq: 0.2
ancestry: "EUR"
quick_smr: true
smr_HEIDI_p: 0.05
plot_col: "#B4D151"
plot_highlight_col: "#8680C0"
save_base_path: "results/smr_dynamic"
stop_on_error: false
