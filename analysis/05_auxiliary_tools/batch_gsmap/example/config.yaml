# Example configuration for the experimental batch gsMap adapter.
# Replace every path with a reviewed local path before running.

sumstats_file: "path/to/trait.sumstats.gz"
trait_name: "example_trait"
samples:
  - "sample_01"
  - "sample_02"
h5ad_dir: "path/to/h5ad"
annotation: "annotation"
data_layer: "count"
max_processes: 2
save_base_path: "results/gsmap"
stop_on_error: false
