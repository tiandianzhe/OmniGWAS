[build-system]
requires = ["setuptools>=77,<82", "wheel>=0.45,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "convert-supergnova"
version = "0.1.0"
description = "Convert SuperGNOVA TXT results to CSV format for GWAS analysis"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Dianzhe Tian", email = "tiandianzhe@outlook.com"}
]
requires-python = ">=3.10"
keywords = ["gwas", "genomics", "bioinformatics", "supergnova", "data-conversion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/tiandianzhe/OmniGWAS"
Documentation = "https://github.com/tiandianzhe/OmniGWAS/tree/main/analysis/05_auxiliary_tools/convert_supergnova"
Repository = "https://github.com/tiandianzhe/OmniGWAS"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8"]

[project.scripts]
supergnova2csv = "convert_supergnova.cli:main"

[tool.setuptools]
packages = ["convert_supergnova"]

[tool.setuptools.package-dir]
convert_supergnova = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
