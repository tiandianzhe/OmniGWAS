name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Restore locked Python environment
        run: uv sync --locked --all-groups
      - name: Check Python syntax
        run: python -m compileall -q analysis/05_auxiliary_tools tests/python
      - name: Lint maintained Python code
        run: >-
          uv run --frozen ruff check
          analysis/05_auxiliary_tools/batch_gsmap/src
          analysis/05_auxiliary_tools/batch_smr_dynamic/src
          analysis/05_auxiliary_tools/manhattan_plot/src
          analysis/05_auxiliary_tools/utils/src
          analysis/05_auxiliary_tools/convert_supergnova/src
          tests/python
      - name: Run Python tests
        run: uv run --frozen pytest -q -m "not integration"
      - name: Build converter distributions
        if: matrix.python-version == '3.14'
        run: uv build --package convert-supergnova
      - name: Test converter wheel in a clean environment
        if: matrix.python-version == '3.14'
        run: |
          python -m venv /tmp/omnigwas-wheel-test
          /tmp/omnigwas-wheel-test/bin/pip install --no-deps dist/*.whl
          /tmp/omnigwas-wheel-test/bin/supergnova2csv --help
          /tmp/omnigwas-wheel-test/bin/supergnova2csv \
            analysis/05_auxiliary_tools/convert_supergnova/example/example_data.txt \
            --output /tmp/supergnova-output.csv \
            --quiet
          cmp /tmp/supergnova-output.csv \
            analysis/05_auxiliary_tools/convert_supergnova/example/expected_output.csv
          python -c \
            'import glob, zipfile; path=glob.glob("dist/*.whl")[0]; names=zipfile.ZipFile(path).namelist(); assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names), names'

  r-and-bridge:
    name: R and Python to R bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: release
          use-public-rspm: true
      - name: Restore locked R environment
        uses: r-lib/actions/setup-renv@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
      - name: Check R dependency state
        run: >-
          Rscript -e
          'status <- renv::status(); if (!isTRUE(status$synchronized)) quit(status = 1)'
      - name: Parse R modules and recipe chunks
        run: Rscript scripts/ci/check_r_sources.R
      - name: Reject runtime dependency installation
        run: Rscript scripts/ci/check_r_dependencies.R
      - name: Run R unit tests
        run: Rscript -e 'testthat::test_dir("tests/r", reporter = "summary")'
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Restore locked Python environment
        run: uv sync --locked --all-groups
      - name: Run cross-language functional tests
        env:
          OMNIGWAS_REQUIRE_R: "1"
        run: uv run --frozen pytest -q tests/python/test_r_bridge_integration.py
      - name: Validate repository YAML
        run: |
          uv run --frozen python -c \
            'import pathlib, yaml; [yaml.safe_load(path.read_text()) for path in [pathlib.Path("CITATION.cff"), pathlib.Path(".github/ISSUE_TEMPLATE/external-validation.yml")]]'
